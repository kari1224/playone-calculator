<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>流水獎勵計算器</title>

<style>
    *{
        box-sizing:border-box;
        font-family:"Microsoft JhengHei",sans-serif;
    }

    body{
        background:#0f172a;
        color:white;
        margin:0;
        padding:30px;
    }

    .container{
        max-width:900px;
        margin:auto;
    }

    h1{
        text-align:center;
        margin-bottom:30px;
    }

    .card{
        background:#1e293b;
        border-radius:20px;
        padding:25px;
        margin-bottom:20px;
        box-shadow:0 0 15px rgba(0,0,0,0.3);
    }

    label{
        display:block;
        margin-bottom:8px;
        font-size:18px;
    }

    select,input{
        width:100%;
        padding:12px;
        border:none;
        border-radius:10px;
        margin-bottom:20px;
        font-size:18px;
    }

    button{
        width:100%;
        padding:15px;
        border:none;
        border-radius:12px;
        background:#38bdf8;
        color:white;
        font-size:20px;
        cursor:pointer;
        font-weight:bold;
    }

    button:hover{
        background:#0ea5e9;
    }

    .result{
        margin-top:25px;
        line-height:2;
        font-size:18px;
    }

    .good{
        color:#4ade80;
        font-weight:bold;
    }

    .bad{
        color:#f87171;
        font-weight:bold;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    th,td{
        border:1px solid #334155;
        padding:10px;
        text-align:center;
    }

    th{
        background:#334155;
    }
</style>
</head>

<body>

<div class="container">

    <h1>流水獎勵計算器</h1>

    <div class="card">

        <label>選擇計畫</label>
        <select id="plan">
            <option value="star">繁星計畫</option>
            <option value="playone_normal">PLAYONE 普通版</option>
            <option value="playone_upgrade">PLAYONE 升級版</option>
        </select>

        <label>輸入目前流水</label>
        <input type="number" id="currentFlow" placeholder="例如：33947">

        <button onclick="calculate()">
            開始計算
        </button>

        <div class="result" id="result"></div>
    </div>

    <div class="card">
        <h2>獎勵表</h2>

        <table id="rewardTable">
            <thead>
                <tr>
                    <th>流水</th>
                    <th>繁星計畫</th>
                    <th>普通版</th>
                    <th>升級版</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script>

const rewardData = [
    {flow:5000, star:500},
    {flow:10000, star:1500, normal:1000, upgrade:1000},
    {flow:15000, star:2300, normal:1500, upgrade:1500},
    {flow:25000, star:4000, normal:2700, upgrade:2700},
    {flow:45000, star:7000, normal:5000, upgrade:6000},
    {flow:65000, star:11000, normal:7300, upgrade:9000},
    {flow:85000, star:15000, normal:9800, upgrade:12000},
    {flow:100000, star:20000, normal:12000, upgrade:15000},
    {flow:150000, star:35000, normal:18000, upgrade:25000},
    {flow:200000, star:50000, normal:24000, upgrade:34000},
    {flow:300000, normal:37000, upgrade:52000},
    {flow:500000, normal:65000, upgrade:88000},
    {flow:1000000, normal:130000, upgrade:180000},
];

function getReward(item, plan){
    if(plan === "star") return item.star || 0;
    if(plan === "playone_normal") return item.normal || 0;
    if(plan === "playone_upgrade") return item.upgrade || 0;
}

function renderTable(){

    const tbody = document.querySelector("#rewardTable tbody");

    rewardData.forEach(item=>{

        tbody.innerHTML += `
            <tr>
                <td>${item.flow.toLocaleString()}</td>
                <td>${(item.star || 0).toLocaleString()}</td>
                <td>${(item.normal || 0).toLocaleString()}</td>
                <td>${(item.upgrade || 0).toLocaleString()}</td>
            </tr>
        `;
    });
}

renderTable();

function calculate(){

    const plan = document.getElementById("plan").value;
    const currentFlow = Number(document.getElementById("currentFlow").value);

    let currentReward = 0;
    let nextTarget = null;
    let nextReward = 0;

    for(let i=0;i<rewardData.length;i++){

        const reward = getReward(rewardData[i],plan);

        if(currentFlow >= rewardData[i].flow && reward > 0){
            currentReward = reward;
        }

        if(currentFlow < rewardData[i].flow && reward > 0){
            nextTarget = rewardData[i].flow;
            nextReward = reward;
            break;
        }
    }

    if(nextTarget === null){
        document.getElementById("result").innerHTML = `
            <div class="good">
                你已達最高階獎勵 🎉
            </div>
        `;
        return;
    }

    const gap = nextTarget - currentFlow;

    // 公式
    const extraBonus = nextReward - currentReward;

    // 實際虧損率
    const realCostRate = 0.7 - 0.4;

    const estimatedCost = gap * realCostRate;

    const netProfit = extraBonus - estimatedCost;

    let worthText = "";
    let worthClass = "";

    if(netProfit > 0){
        worthText = "值得拼下一階 ✅";
        worthClass = "good";
    }else{
        worthText = "不划算 ❌";
        worthClass = "bad";
    }

    document.getElementById("result").innerHTML = `
        <hr>

        <div>目前獎金：${currentReward.toLocaleString()}</div>

        <div>下一階流水：${nextTarget.toLocaleString()}</div>

        <div>下一階獎金：${nextReward.toLocaleString()}</div>

        <div>還差流水：${gap.toLocaleString()}</div>

        <div>額外可多拿：${extraBonus.toLocaleString()}</div>

        <div>補流水實際成本：
            ${estimatedCost.toFixed(0)}
        </div>

        <div>
            預估淨收益：
            <b>${netProfit.toFixed(0)}</b>
        </div>

        <div class="${worthClass}">
            ${worthText}
        </div>
    `;
}

</script>

</body>
</html>

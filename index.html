<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PLAYONE 階梯收益分析器</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  font-family:"Microsoft JhengHei",sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  min-height:100vh;
  color:white;
}

.container{
  max-width:700px;
  margin:auto;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 30px rgba(0,0,0,0.25);
}

h1{
  text-align:center;
  margin-bottom:24px;
  font-size:32px;
}

.input-group{
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
  font-size:15px;
}

input,select{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  outline:none;
}

button{
  width:100%;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#00d26a;
  color:#111;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.02);
}

.card{
  margin-top:24px;
  background:rgba(255,255,255,0.15);
  border-radius:20px;
  padding:20px;
}

.best{
  text-align:center;
}

.best-title{
  font-size:18px;
  opacity:0.8;
}

.best-target{
  font-size:34px;
  font-weight:bold;
  margin:10px 0;
}

.best-profit{
  font-size:28px;
  font-weight:bold;
}

.green{
  color:#71ff9f;
}

.red{
  color:#ff8c8c;
}

.details{
  margin-top:18px;
}

details{
  background:rgba(255,255,255,0.08);
  padding:14px;
  border-radius:14px;
}

summary{
  cursor:pointer;
  font-weight:bold;
  font-size:16px;
}

.calc{
  margin-top:12px;
  line-height:1.8;
  white-space:pre-line;
  font-size:15px;
}

.footer{
  margin-top:24px;
  text-align:center;
  opacity:0.5;
  font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<h1>✨ 階梯收益分析器</h1>

<div class="input-group">
<label>選擇計畫</label>

<select id="plan">
  <option value="star">繁星計畫</option>
  <option value="support_normal">扶持計畫（普通版）</option>
  <option value="support_plus">扶持計畫（升級版）</option>
</select>
</div>

<div class="input-group">
<label>輸入目前流水</label>
<input type="number" id="amount" placeholder="例如：21420">
</div>

<button onclick="analyze()">開始分析</button>

<div id="output"></div>

<div class="footer">
歌璃製作｜love650324
</div>

</div>

<script>

const COST_RATE = 0.4;

const plans = {

  star: {
    name: "繁星計畫",
    table: {
      5000: 500,
      10000: 1500,
      15000: 2300,
      25000: 4000,
      45000: 7000,
      65000: 11000,
      85000: 15000,
      100000: 20000,
      150000: 35000,
      200000: 50000
    }
  },

  support_normal: {
    name: "扶持計畫（普通版）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 5000,
      65000: 7300,
      85000: 9800,
      100000: 12000,
      150000: 18000,
      200000: 24000,
      300000: 37000,
      500000: 65000,
      1000000: 130000
    }
  },

  support_plus: {
    name: "扶持計畫（升級版）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 6000,
      65000: 9000,
      85000: 12000,
      100000: 15000,
      150000: 25000,
      200000: 34000,
      300000: 52000,
      500000: 88000,
      1000000: 180000
    }
  }

};

function analyze(){

  const amount = parseInt(document.getElementById("amount").value);
  const planKey = document.getElementById("plan").value;

  if(isNaN(amount) || amount <= 0){
    alert("請輸入正確流水");
    return;
  }

  const plan = plans[planKey];
  const table = plan.table;

  const tiers = Object.keys(table)
    .map(Number)
    .sort((a,b)=>a-b);

  let currentTier = 0;
  let currentBonus = 0;

  // 找目前所在階梯
  for(const t of tiers){
    if(amount >= t){
      currentTier = t;
      currentBonus = table[t];
    }
  }

  let best = null;

  // 計算所有可跳階方案
  for(const t of tiers){

    if(t <= amount) continue;

    const gap = t - amount;

    // 補流水成本
    const cost = gap * COST_RATE;

    // 目標獎金
    const targetBonus = table[t];

    // 實際增加收益
    const profitDiff = targetBonus - currentBonus;

    // 真正淨收益
    const net = profitDiff - cost;

    if(!best || net > best.net){

      best = {
        target:t,
        gap,
        cost,
        targetBonus,
        profitDiff,
        net
      };

    }

  }

  if(!best){
    document.getElementById("output").innerHTML = `
      <div class="card">
        已達最高階梯
      </div>
    `;
    return;
  }

  // 是否值得補
  const shouldFill = best.net > 0;

  document.getElementById("output").innerHTML = `

  <div class="card best">

    <div class="best-title">
      ${plan.name}｜分析結果
    </div>

    <div class="best-target">
      ${
        shouldFill
        ? `建議補到 ${best.target.toLocaleString()}`
        : `不建議補`
      }
    </div>

    <div class="best-profit ${shouldFill ? "green" : "red"}">
      ${
        shouldFill
        ? `預估淨賺 +${Math.round(best.net).toLocaleString()}`
        : `預估虧損 ${Math.abs(Math.round(best.net)).toLocaleString()}`
      }
    </div>

  </div>

  <div class="details">

    <details>

      <summary>查看詳細計算</summary>

      <div class="calc">
目前流水：
${amount.toLocaleString()}
━━━━━━━━━━
目前階梯：
${currentTier.toLocaleString()}
目前獎金：
${currentBonus.toLocaleString()}
━━━━━━━━━━
目標階梯：
${best.target.toLocaleString()}
目標獎金：
${best.targetBonus.toLocaleString()}
━━━━━━━━━━
缺額：
${best.target.toLocaleString()}
- ${amount.toLocaleString()}
= ${best.gap.toLocaleString()}
━━━━━━━━━━
補流水成本：
${best.gap.toLocaleString()}
× ${COST_RATE}
= ${Math.round(best.cost).toLocaleString()}
━━━━━━━━━━
增加收益：
${best.targetBonus.toLocaleString()}
- ${currentBonus.toLocaleString()}
= ${best.profitDiff.toLocaleString()}
━━━━━━━━━━
最終淨收益：
${best.profitDiff.toLocaleString()}
- ${Math.round(best.cost).toLocaleString()}
= ${Math.round(best.net).toLocaleString()}

━━━━━━━━━━
結論：
${
  shouldFill
  ? `因為淨收益為正值，所以建議補流水。`
  : `因為淨收益為負值，所以不建議補流水。`
}

      </div>

    </details>

  </div>

  `;
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>階梯補流水分析器 v5（現實決策版）</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei";
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  padding:20px;
}

.container{
  max-width:820px;
  margin:auto;
  background:rgba(255,255,255,0.12);
  padding:24px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

h1{text-align:center;}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button{
  background:#00d26a;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:18px;
  padding:16px;
  background:rgba(255,255,255,0.15);
  border-radius:16px;
}

.green{color:#6dff9b;}
.red{color:#ff7a7a;}

summary{cursor:pointer;font-weight:bold;}

details{margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<h1>📊 階梯補流水分析器 v5</h1>

<label>目前流水</label>
<input id="amount" type="number" placeholder="例如 158604" min="0">

<label>選擇計畫</label>
<select id="plan">
  <option value="star">繁星計畫</option>
  <option value="support_normal">扶持計畫（普通）</option>
  <option value="support_plus">扶持計畫（升級）</option>
</select>

<button onclick="calc()">開始分析</button>

<div id="result"></div>

</div>

<script>

const COST_RATE = 0.3;
const REVENUE_RATE = 0.4;

/* =========================
   計畫
========================= */
const plans = {
  star: {
    name: "繁星計畫",
    table: {
      5000: 500,
      10000: 1500,
      15000: 2300,
      25000: 4000,
      45000: 7000,
      65000: 11000,
      85000: 15000,
      100000: 20000,
      150000: 35000,
      200000: 50000
    }
  },

  support_normal: {
    name: "扶持計畫（普通）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 5000,
      65000: 7300,
      85000: 9800,
      100000: 12000,
      150000: 18000,
      200000: 24000,
      300000: 37000,
      500000: 65000
    }
  },

  support_plus: {
    name: "扶持計畫（升級）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 6000,
      65000: 9000,
      85000: 12000,
      100000: 15000,
      150000: 25000,
      200000: 34000,
      300000: 52000,
      500000: 88000
    }
  }
};

/* =========================
   取得當前階
========================= */
function getCurrent(amount, table){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let tier=0, bonus=0;

  for(const k of keys){
    if(amount >= k){
      tier = k;
      bonus = table[k];
    }
  }
  return {tier, bonus};
}

/* =========================
   主計算
========================= */
function calc(){

const amount = Number(document.getElementById("amount").value);
const plan = plans[document.getElementById("plan").value];
const table = plan.table;

if(!amount){
  alert("請輸入流水");
  return;
}

const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);

const {tier:curTier, bonus:curBonus} = getCurrent(amount, table);

let candidates = [];
let theoreticalBest = null;

/* =========================
   🔥 限制：現實可達範圍
   👉 不允許跳太遠
========================= */
const MAX_GAP = 80000; // 👈 關鍵：避免跳 100萬

for(const k of keys){

  if(k <= amount) continue;

  const gap = k - amount;

  // ❌ 現實限制：太遠不算
  if(gap > MAX_GAP) continue;

  const cost = gap * COST_RATE;
  const bonus = table[k];
  const revenue = gap * REVENUE_RATE;

  const net = (bonus - curBonus) + revenue - cost;

  const roi = net / cost;

  const item = {k, gap, cost, bonus, net, roi};

  candidates.push(item);

  if(!theoreticalBest || net > theoreticalBest.net){
    theoreticalBest = item;
  }
}

/* =========================
   沒候選
========================= */
if(candidates.length === 0){
  document.getElementById("result").innerHTML =
    `<div class="card">⚠️ 沒有可合理升階的選項</div>`;
  return;
}

/* =========================
   現實最佳（ROI加權）
========================= */
let realisticBest = candidates
  .sort((a,b)=>b.net - a.net)[0];

/* =========================
   UI
========================= */
document.getElementById("result").innerHTML = `

<div class="card">

<h2>🎯 現實建議方案</h2>

<p>✔ 補到：
<b>${realisticBest.k.toLocaleString()}</b></p>

<p>預估淨收益：
<span class="${realisticBest.net>0?'green':'red'}">
${realisticBest.net.toFixed(0)}
</span>
</p>

<p>ROI：
${(realisticBest.roi*100).toFixed(2)}%
</p>

</div>

<div class="card">

<h3>🧠 理論最優（僅參考）</h3>
<p>補到：${theoreticalBest.k.toLocaleString()}</p>
<p>淨收益：${theoreticalBest.net.toFixed(0)}</p>

</div>

<details class="card">
<summary> 詳細計算</summary>

<pre>
目前流水：${amount.toLocaleString()}
目前階梯：${curTier.toLocaleString()}
目前獎金：${curBonus.toLocaleString()}
----------------------
現實最佳：
補到 ${realisticBest.k}
缺額 ${realisticBest.gap}
成本 ${realisticBest.cost.toFixed(0)}
獎金 ${realisticBest.bonus}
ROI ${(realisticBest.roi*100).toFixed(2)}%

----------------------
限制條件：
最大補距離 = ${MAX_GAP.toLocaleString()}

----------------------

理論最優：
補到 ${theoreticalBest.k}
淨收益 ${theoreticalBest.net.toFixed(0)}
</pre>

</details>

`;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>流水計算器</title>

<style>

body{
    margin:0;
    background:#0f172a;
    color:#fff;
    font-family:"Microsoft JhengHei";
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.title{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    margin-bottom:25px;
}

.card{
    background:#1e293b;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
}

label{
    display:block;
    margin:10px 0 6px;
}

select,input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    cursor:pointer;
    border:none;
}

.mainBtn{
    width:100%;
    padding:14px;
    margin-top:10px;
    background:#38bdf8;
    color:#fff;
    font-size:18px;
    border-radius:12px;
    font-weight:bold;
}

.mainBtn:hover{
    background:#0ea5e9;
}

.result{
    margin-top:20px;
    line-height:2;
    font-size:18px;
}

.good{color:#4ade80;font-weight:bold;font-size:22px;}
.bad{color:#f87171;font-weight:bold;font-size:22px;}
.mid{color:#facc15;font-weight:bold;font-size:22px;}

.detailBtn{
    margin-top:12px;
    padding:10px 14px;
    border-radius:10px;
    background:#475569;
    color:#fff;
}

#detailBox{
    display:none;
    margin-top:15px;
    padding:15px;
    background:#0f172a;
    border-radius:12px;
    line-height:2;
}

table{
    width:80%;
    margin:20px auto 0;
    border-collapse:collapse;
    opacity:0.6;
    font-size:14px;
}

th,td{
    border:1px solid #334155;
    padding:8px;
    text-align:center;
}

th{
    background:#334155;
}

.smallTitle{
    text-align:center;
    margin-top:10px;
    opacity:0.7;
}

</style>
</head>

<body>

<div class="container">

<div class="title">流水獎勵計算器</div>

<div class="card">

<label>選擇計畫</label>
<select id="plan">
    <option value="star">繁星計畫</option>
    <option value="normal">PLAYONE 普通版</option>
    <option value="upgrade">PLAYONE 升級版</option>
</select>

<label>目前流水</label>
<input id="flow" type="number" placeholder="輸入目前流水">

<label>收流水比例（可改 0.7 / 0.71 / 0.72）</label>
<input id="rate" type="number" step="0.01" value="0.7">

<button class="mainBtn" onclick="calc()">開始計算</button>

<div class="result" id="result"></div>

<button class="detailBtn" onclick="toggle()">查看詳細算式</button>

<div id="detailBox"></div>

</div>

<div class="smallTitle">獎勵表（僅參考）</div>

<table>
<tr>
<th>流水</th>
<th>繁星</th>
<th>普通</th>
<th>升級</th>
</tr>
<tbody id="tb"></tbody>
</table>

</div>

<script>

const data = [
{flow:5000, star:500},
{flow:10000, star:1500, normal:1000, upgrade:1000},
{flow:15000, star:2300, normal:1500, upgrade:1500},
{flow:25000, star:4000, normal:2700, upgrade:2700},
{flow:45000, star:7000, normal:5000, upgrade:6000},
{flow:65000, star:11000, normal:7300, upgrade:9000},
{flow:85000, star:15000, normal:9800, upgrade:12000},
{flow:100000, star:20000, normal:12000, upgrade:15000},
];

function reward(item, plan){
if(plan==="star") return item.star||0;
if(plan==="normal") return item.normal||0;
if(plan==="upgrade") return item.upgrade||0;
}

function render(){
let tb=document.getElementById("tb");
data.forEach(d=>{
tb.innerHTML+=`
<tr>
<td>${d.flow.toLocaleString()}</td>
<td>${(d.star||0).toLocaleString()}</td>
<td>${(d.normal||0).toLocaleString()}</td>
<td>${(d.upgrade||0).toLocaleString()}</td>
</tr>`;
});
}
render();

let detailHTML="";

function toggle(){
let d=document.getElementById("detailBox");
d.style.display = d.style.display==="none"?"block":"none";
}

function calc(){

let flow=Number(document.getElementById("flow").value);
let rate=Number(document.getElementById("rate").value);
let plan=document.getElementById("plan").value;

let cur=0,nextF=0,nextR=0;

for(let i=0;i<data.length;i++){
let r=reward(data[i],plan);
if(flow>=data[i].flow) cur=r;
if(flow<data[i].flow){
nextF=data[i].flow;
nextR=r;
break;
}
}

let gap=nextF-flow;
let extra=nextR-cur;

let costRate=rate-0.4;
let cost=gap*costRate;
let net=extra-cost;

let text="",cls="";

if(net>0){
text="值得拼下一階 ✅";cls="good";
}else if(net<0){
text="不划算 ❌";cls="bad";
}else{
text="剛好打平 ⚖️<br>看你要不要拼排名或其他獎勵";
cls="mid";
}

document.getElementById("result").innerHTML=`
目前獎金：${cur.toLocaleString()}<br>
下一階流水｜獎金：${nextF.toLocaleString()}｜${nextR.toLocaleString()}<br>
還差流水：${gap.toLocaleString()}<br>
額外可多拿：${extra.toLocaleString()}<br>
補流水實際成本：${Math.round(cost)}<br>
預估淨收益：${Math.round(net)}<br>
<div class="${cls}">${text}</div>
`;

detailHTML=`
<h3>詳細算式</h3>
<hr>
缺額 = ${nextF}-${flow} = ${gap}<br><br>
補流水成本 = ${gap} × ${rate} = ${Math.round(gap*rate)}<br>
流水收益 = ${gap} × 0.4 = ${Math.round(gap*0.4)}<br>
額外獎金 = ${nextR}-${cur} = ${extra}<br><br>
淨收益 = 流水收益 + 額外獎金 - 補流水成本<br>
= ${Math.round(gap*0.4)} + ${extra} - ${Math.round(gap*rate)}<br>
= <b>${Math.round(net)}</b>
`;

document.getElementById("detailBox").innerHTML=detailHTML;
document.getElementById("detailBox").style.display="none";
}

</script>

</body>
</html>

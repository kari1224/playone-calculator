<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>階梯補流水分析器 v6</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei";
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  padding:20px;
}

.container{
  max-width:860px;
  margin:auto;
  background:rgba(255,255,255,0.12);
  padding:24px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

h1{text-align:center;}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button{
  background:#00d26a;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:16px;
  padding:16px;
  background:rgba(255,255,255,0.15);
  border-radius:16px;
}

.green{color:#6dff9b;}
.red{color:#ff7a7a;}

pre{white-space:pre-wrap;}

summary{cursor:pointer;font-weight:bold;}
details{margin-top:10px;}
</style>
</head>

<body>

<div class="container">

<h1>📊 階梯補流水分析器 v6（正確算法版）</h1>

<label>目前流水</label>
<input id="amount" type="number" placeholder="例如 158604" min="0">

<label>選擇計畫</label>
<select id="plan">
  <option value="star">繁星計畫</option>
  <option value="support_normal">扶持計畫（普通）</option>
  <option value="support_plus">扶持計畫（升級）</option>
</select>

<button onclick="calc()">開始分析</button>

<div id="result"></div>

</div>

<script>

const COST_RATE = 0.3;
const REVENUE_RATE = 0.4;

/* =========================
   計畫
========================= */
const plans = {
  star: {
    name: "繁星計畫",
    table: {
      5000: 500,
      10000: 1500,
      15000: 2300,
      25000: 4000,
      45000: 7000,
      65000: 11000,
      85000: 15000,
      100000: 20000,
      150000: 35000,
      200000: 50000
    }
  },

  support_normal: {
    name: "扶持計畫（普通）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 5000,
      65000: 7300,
      85000: 9800,
      100000: 12000,
      150000: 18000,
      200000: 24000,
      300000: 37000
    }
  },

  support_plus: {
    name: "扶持計畫（升級）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 6000,
      65000: 9000,
      85000: 12000,
      100000: 15000,
      150000: 25000,
      200000: 34000,
      300000: 52000
    }
  }
};

/* =========================
   取得階
========================= */
function getCurrent(amount, table){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let tier=0, bonus=0;

  for(const k of keys){
    if(amount >= k){
      tier = k;
      bonus = table[k];
    }
  }
  return {tier, bonus};
}

/* =========================
   三個獨立引擎
========================= */
function runEngines(amount, plan){

  const table = plan.table;
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);

  const {tier:curTier, bonus:curBonus} = getCurrent(amount, table);

  let flowBest=null;
  let bonusBest=null;
  let mixBest=null;

  for(const k of keys){
    if(k <= amount) continue;

    const gap = k - amount;
    const cost = gap * COST_RATE;
    const revenue = gap * REVENUE_RATE;
    const bonus = table[k];

    /* 🟦 流水引擎 */
    const flowNet = revenue - cost;

    /* 🟨 獎金引擎 */
    const bonusNet = bonus - curBonus - cost;

    /* 🟩 綜合引擎 */
    const mixNet = (bonus - curBonus) + revenue - cost;

    const item = {k, gap, cost, revenue, bonus};

    if(!flowBest || flowNet > flowBest.net)
      flowBest = {...item, net:flowNet};

    if(!bonusBest || bonusNet > bonusBest.net)
      bonusBest = {...item, net:bonusNet};

    if(!mixBest || mixNet > mixBest.net)
      mixBest = {...item, net:mixNet};
  }

  return {flowBest, bonusBest, mixBest, curTier, curBonus};
}

/* =========================
   主計算
========================= */
function calc(){

const amount = Number(document.getElementById("amount").value);
const plan = plans[document.getElementById("plan").value];

if(!amount){
  alert("請輸入流水");
  return;
}

const r = runEngines(amount, plan);

/* =========================
   UI
========================= */
document.getElementById("result").innerHTML = `

<div class="card">
<h2>🟩 綜合決策（推薦）</h2>
<p>補到：<b>${r.mixBest.k.toLocaleString()}</b></p>
<p>淨收益：
<span class="${r.mixBest.net>0?'green':'red'}">
${r.mixBest.net.toFixed(0)}
</span></p>
</div>

<div class="card">
<h3>🟦 流水模式最佳</h3>
<p>補到：${r.flowBest.k.toLocaleString()}</p>
<p>淨收益：${r.flowBest.net.toFixed(0)}</p>
</div>

<div class="card">
<h3>🟨 獎金模式最佳</h3>
<p>補到：${r.bonusBest.k.toLocaleString()}</p>
<p>淨收益：${r.bonusBest.net.toFixed(0)}</p>
</div>

<details class="card">
<summary>詳細資訊</summary>

<pre>
目前流水：${amount.toLocaleString()}
目前階：${r.curTier.toLocaleString()}
目前獎金：${r.curBonus.toLocaleString()}
----------------------
綜合最佳：${r.mixBest.k}
流水最佳：${r.flowBest.k}
獎金最佳：${r.bonusBest.k}
----------------------

所有算法完全獨立計算
不互相影響
</pre>

</details>

`;

}

</script>

</body>
</html>

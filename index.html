<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>階梯補流水分析器（雙模型）</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei";
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  padding:20px;
}

.container{
  max-width:820px;
  margin:auto;
  background:rgba(255,255,255,0.12);
  padding:24px;
  border-radius:18px;
  backdrop-filter:blur(10px);
}

h1{text-align:center;}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

button{
  background:#00d26a;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:16px;
  padding:14px;
  background:rgba(255,255,255,0.15);
  border-radius:14px;
}

summary{cursor:pointer;font-weight:bold;}
details{margin-top:10px;}

.green{color:#6dff9b;}
.red{color:#ff7a7a;}
.blue{color:#7fd3ff;}
</style>
</head>

<body>

<div class="container">

<h1>📊 階梯補流水分析器 v6</h1>

<input id="amount" type="number" placeholder="目前流水">

<select id="plan">
  <option value="star">繁星計畫</option>
  <option value="support_normal">扶持計畫（普通版）</option>
  <option value="support_plus">扶持計畫（升級版）</option>
</select>

<button onclick="calc()">開始分析</button>

<div id="result"></div>

</div>

<script>

const COST_RATE = 0.3;
const REVENUE_RATE = 0.4;

/* =========================
   計畫
========================= */
const plans = {
  star: {
    name: "繁星計畫",
    table: {
      5000: 500,
      10000: 1500,
      15000: 2300,
      25000: 4000,
      45000: 7000,
      65000: 11000,
      85000: 15000,
      100000: 20000,
      150000: 35000,
      200000: 50000
    }
  },

  support_normal: {
    name: "扶持計畫（普通版）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 5000,
      65000: 7300,
      85000: 9800,
      100000: 12000,
      150000: 18000,
      200000: 24000,
      300000: 37000,
      500000: 65000
    }
  },

  support_plus: {
    name: "扶持計畫（升級版）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 6000,
      65000: 9000,
      85000: 12000,
      100000: 15000,
      150000: 25000,
      200000: 34000,
      300000: 52000,
      500000: 88000
    }
  }
};

/* =========================
   當前階
========================= */
function getCurrent(amount, table){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let tier=0, bonus=0;

  for(const k of keys){
    if(amount >= k){
      tier = k;
      bonus = table[k];
    }
  }
  return {tier, bonus};
}

/* =========================
   主計算（A + B）
========================= */
function calc(){

const amount = Number(document.getElementById("amount").value);
const plan = plans[document.getElementById("plan").value];
const table = plan.table;

if(!amount){
  alert("請輸入流水");
  return;
}

const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);

const {tier:curTier, bonus:curBonus} = getCurrent(amount, table);

/* =========================
   A模型（全域最優）
========================= */
let bestA = null;

/* =========================
   B模型（增量決策）
========================= */
let bestB = null;

for(const k of keys){

  if(k <= amount) continue;

  const gap = k - amount;
  const cost = gap * COST_RATE;
  const revenue = gap * REVENUE_RATE;
  const bonus = table[k];

  const net = (bonus - curBonus) + revenue - cost;

  /* A模型：純最大值 */
  if(!bestA || net > bestA.net){
    bestA = {k, gap, cost, bonus, net};
  }

  /* B模型：只看「這一步」合理性 */
  const incremental = (bonus - curBonus) - cost;

  if(!bestB || incremental > bestB.incremental){
    bestB = {
      k,
      gap,
      cost,
      bonus,
      incremental
    };
  }
}

/* =========================
   UI
========================= */
document.getElementById("result").innerHTML = `

<div class="card">
<h2>🧠 A模型（全域最優）</h2>

<p>最佳補到：
<b>${bestA.k.toLocaleString()}</b></p>

<p>預估總淨收益：
<span class="${bestA.net>0?'green':'red'}">
${bestA.net.toFixed(0)}
</span></p>
</div>

<div class="card">
<h2>🎯 B模型（增量決策）</h2>

<p>建議補到：
<b>${bestB.k.toLocaleString()}</b></p>

<p>這一步淨收益：
<span class="${bestB.incremental>0?'green':'red'}">
${bestB.incremental.toFixed(0)}
</span></p>
</div>

<details class="card">
<summary>▼ 詳細計算</summary>

<pre>
目前流水：${amount.toLocaleString()}
目前階梯：${curTier}
目前獎金：${curBonus}

----------------------

【A模型】
補到 ${bestA.k}
總淨收益 ${bestA.net.toFixed(0)}

----------------------

【B模型】
補到 ${bestB.k}
增量收益 ${bestB.incremental.toFixed(0)}

----------------------

公式：

A模型 =
(最終獎金 + 流水收益 - 成本)

B模型 =
(新增獎金 - 成本)
</pre>

</details>

`;

}

</script>

</body>
</html>

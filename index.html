<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>階梯補流水分析器 v4</title>

<style>
body{
  margin:0;
  font-family:"Microsoft JhengHei";
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  padding:20px;
}

.container{
  max-width:820px;
  margin:auto;
  background:rgba(255,255,255,0.12);
  padding:24px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

h1{text-align:center;}

input,select,button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  border:none;
  font-size:16px;
}

button{
  background:#00d26a;
  font-weight:bold;
  cursor:pointer;
}

.card{
  margin-top:18px;
  padding:16px;
  background:rgba(255,255,255,0.15);
  border-radius:16px;
}

.green{color:#6dff9b;}
.red{color:#ff7a7a;}
.yellow{color:#ffd36d;}

summary{
  cursor:pointer;
  font-weight:bold;
}

details{
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📊 階梯補流水分析器 v4</h1>

<label>目前流水</label>
<input id="amount" type="number" placeholder="例如 158604" min="0">

<label>選擇計畫</label>
<select id="plan">
  <option value="star">繁星計畫</option>
  <option value="support_normal">扶持計畫（普通）</option>
  <option value="support_plus">扶持計畫（升級）</option>
</select>

<label>選擇模式</label>
<select id="viewMode">
  <option value="decision">🎯 決策模式（推薦）</option>
  <option value="roi">📊 ROI分析模式</option>
  <option value="compare">📈 全階比較模式</option>
</select>

<button onclick="calc()">開始分析</button>

<div id="result"></div>

</div>

<script>

const COST_RATE = 0.3;

const plans = {
  star: {
    name: "繁星計畫",
    table: {
      5000: 500,
      10000: 1500,
      15000: 2300,
      25000: 4000,
      45000: 7000,
      65000: 11000,
      85000: 15000,
      100000: 20000,
      150000: 35000,
      200000: 50000
    }
  },

  support_normal: {
    name: "扶持計畫（普通）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 5000,
      65000: 7300,
      85000: 9800,
      100000: 12000,
      150000: 18000,
      200000: 24000,
      300000: 37000,
      500000: 65000,
      1000000: 130000
    }
  },

  support_plus: {
    name: "扶持計畫（升級）",
    table: {
      10000: 1000,
      15000: 1500,
      25000: 2700,
      45000: 6000,
      65000: 9000,
      85000: 12000,
      100000: 15000,
      150000: 25000,
      200000: 34000,
      300000: 52000,
      500000: 88000,
      1000000: 180000
    }
  }
};

function getCurrent(amount, table){
  const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);
  let tier = 0, bonus = 0;

  for(const k of keys){
    if(amount >= k){
      tier = k;
      bonus = table[k];
    }
  }
  return {tier, bonus};
}

function calc(){

const amount = Number(document.getElementById("amount").value);
const planKey = document.getElementById("plan").value;
const viewMode = document.getElementById("viewMode").value;

if(!amount){
  alert("請輸入流水");
  return;
}

const plan = plans[planKey];
const table = plan.table;

const keys = Object.keys(table).map(Number).sort((a,b)=>a-b);

const {tier:curTier, bonus:curBonus} = getCurrent(amount, table);

let best = null;
let allResults = [];

for(const k of keys){

  if(k <= amount) continue;

  const gap = k - amount;
  const cost = gap * COST_RATE;
  const bonus = table[k];
  const revenue = gap * 0.4;

  const net = (bonus - curBonus) + revenue - cost;

  const roi = net / cost;
  const efficiency = net / gap;

  const item = {k, gap, cost, bonus, net, roi, efficiency};

  allResults.push(item);

  if(!best || net > best.net){
    best = item;
  }
}

if(!best){
  document.getElementById("result").innerHTML =
    `<div class="card">已達最高階，無需補流水</div>`;
  return;
}

render(best, allResults, plan, amount, curTier, curBonus, viewMode);

}

function render(best, all, plan, amount, curTier, curBonus, mode){

const roi = best.roi;
const efficiency = best.efficiency;

let html = "";

/* =========================
   🎯 決策模式（最簡潔）
========================= */
if(mode === "decision"){
  html = `
  <div class="card">
    <h2>✔ 最佳方案</h2>
    <p>補到：<b>${best.k.toLocaleString()}</b></p>
    <p>預估淨收益：
      <span class="${best.net>0?'green':'red'}">
      ${best.net.toFixed(0)}
      </span>
    </p>
  </div>
  `;
}

/* =========================
   📊 ROI模式（你朋友要的）
========================= */
if(mode === "roi"){
  html = `
  <div class="card">
    <h2>📊 ROI分析</h2>

    <p>ROI：
      <span class="${roi>0?'green':'red'}">
      ${(roi*100).toFixed(2)}%
      </span>
    </p>

    <p>效率（每1元補流水）：
      ${efficiency.toFixed(3)}
    </p>

    <hr>

    <p>最佳補點：${best.k.toLocaleString()}</p>
    <p>淨收益：${best.net.toFixed(0)}</p>
  </div>
  `;
}

/* =========================
   📈 全比較模式（進階）
========================= */
if(mode === "compare"){

  const sorted = all.sort((a,b)=>b.net-a.net).slice(0,10);

  html = `
  <div class="card">
    <h2>📈 階梯排行（Top 10）</h2>

    <p>最佳補點：<b>${best.k.toLocaleString()}</b></p>
    <p>ROI：${(roi*100).toFixed(2)}%</p>

    <hr>

    <pre>
${sorted.map(x =>
`補到 ${x.k} | 淨賺 ${x.net.toFixed(0)} | ROI ${(x.roi*100).toFixed(1)}%`
).join("\n")}
    </pre>
  </div>
  `;
}

/* =========================
   🔍 詳細計算（永遠可展開）
========================= */

html += `
<details class="card">
<summary>▼ 詳細計算</summary>

<pre>
目前流水：${amount.toLocaleString()}
目前階梯：${curTier.toLocaleString()}
目前獎金：${curBonus.toLocaleString()}

----------------------

目標階梯：${best.k.toLocaleString()}
缺額：
${best.k} - ${amount} = ${best.gap.toLocaleString()}
補流水成本：
${best.gap} × ${COST_RATE} = ${best.cost.toFixed(0)}
獎金差額：
${best.bonus - curBonus}
流水收益：
${(best.gap * 0.4).toFixed(0)}

----------------------
最終淨收益：
${best.net.toFixed(0)}

ROI：
${(best.roi*100).toFixed(2)}%
效率：
${best.efficiency.toFixed(3)}

----------------------
計畫：${plan.name}
</pre>

</details>
`;

document.getElementById("result").innerHTML = html;

}

</script>

</body>
</html>
